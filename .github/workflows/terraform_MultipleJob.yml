name: Azure Terraform CI/CD

on:
  workflow_dispatch:
  
permissions:
  id-token: write
  contents: read
  
jobs:
  terraform-install-init:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0
        
      - name: Install Terraform
        uses: autero1/action-terraform@v3.0.1
        with: 
         terraform-version: 1.13.0 
         
      - name: Azure Login
        uses: Azure/login@v2.3.0
        with:
          client-id: 002b7833-7473-4b31-bd2f-550f1fef68c0
          tenant-id: 8839fa1a-72d2-4f19-8736-4c73cf13d7a6
          subscription-id: 38d52de4-2fb6-4a85-96fb-5ba22d363e4e

      - name: Terraform Init
        run: terraform init 

  terraform-init-plan:
    needs: terraform-install-init
    runs-on: ubuntu-latest

    steps:
      # - name: Checkout code
      #   uses: actions/checkout@v5.0.0
        
      # - name: Install Terraform
      #   uses: autero1/action-terraform@v3.0.1
      #   with: 
      #    terraform-version: 1.13.0 
         
      - name: Azure Login
        uses: Azure/login@v2.3.0
        with:
          client-id: 002b7833-7473-4b31-bd2f-550f1fef68c0
          tenant-id: 8839fa1a-72d2-4f19-8736-4c73cf13d7a6
          subscription-id: 38d52de4-2fb6-4a85-96fb-5ba22d363e4e

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

  terraform-init-apply:
    needs: terraform-init-plan
    runs-on: ubuntu-latest

    steps:
      # - name: Checkout code
      #   uses: actions/checkout@v5.0.0
        
      # - name: Install Terraform
      #   uses: autero1/action-terraform@v3.0.1
      #   with: 
      #    terraform-version: 1.13.0 
         
      - name: Azure Login
        uses: Azure/login@v2.3.0
        with:
          client-id: 002b7833-7473-4b31-bd2f-550f1fef68c0
          tenant-id: 8839fa1a-72d2-4f19-8736-4c73cf13d7a6
          subscription-id: 38d52de4-2fb6-4a85-96fb-5ba22d363e4e

      - name: Terraform Init
        run: terraform init

      # - name: Terraform Validate
      #   run: terraform validate

      # - name: Terraform Plan
      #   run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan          
             
          
